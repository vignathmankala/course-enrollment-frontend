# ===== Database connection =====
# On Render (or your laptop), these come from environment variables.
# The fallback values (after the colon) are used only if no environment variable is set.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/course_enrollment_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vinay123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Server port =====
server.port=${PORT:8080}
